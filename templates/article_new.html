{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}New Article{% endblock title %}

{% block content %}

<h1>Create New Article</h1>

<form method="post">

    {% csrf_token %}

    {{ form|crispy }}

    <button class="btn btn-success" type="submit">
        Save Article
    </button>

    <a href="{% url 'article_list' %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock content %}
