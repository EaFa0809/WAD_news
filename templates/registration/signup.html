{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Up{% endblock title %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <h2 class="mb-4">Sign Up</h2>

        <form method="post">
            {% csrf_token %}

            {{ form|crispy }}

            <button class="btn btn-success" type="submit">
                Sign Up
            </button>
        </form>

    </div>
</div>

{% endblock content %}
