{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log In{% endblock title %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <h2 class="mb-4">Log In</h2>

        <form method="post">
            {% csrf_token %}

            {{ form|crispy }}

            <button class="btn btn-success" type="submit">
                Log In
            </button>
        </form>

        <p class="mt-3">
            <a href="{% url 'password_reset' %}">
                Forgot your password?
            </a>
        </p>

    </div>
</div>

{% endblock content %}
