{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Edit Article{% endblock title %}

{% block content %}

<h1>Edit Article</h1>

<form method="post">

    {% csrf_token %}

    {{ form|crispy }}

    <button class="btn btn-info" type="submit">
        Update
    </button>

    <a href="{% url 'article_list' %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock content %}
